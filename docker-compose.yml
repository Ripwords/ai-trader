name: ai-trader

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  drizzle-migrate:
    build:
      context: ./apps/web
      target: migrate
    environment:
      # Derive from parts so it can't drift if you rotate POSTGRES_PASSWORD.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # Opt-in: brings Ghostfolio cross-broker portfolio data into the agent.
  # Enable with `docker compose --profile ghostfolio up -d` once you've set
  # GHOSTFOLIO_URL + GHOSTFOLIO_TOKEN in .env. The web service detects it
  # at runtime by trying to connect; if the service isn't running, the
  # ghostfolio_* tools simply don't appear to the agent.
  ghostfolio-mcp:
    image: ghcr.io/mhajder/ghostfolio-mcp:latest
    profiles: [ghostfolio]
    environment:
      GHOSTFOLIO_URL: ${GHOSTFOLIO_URL:-}
      GHOSTFOLIO_TOKEN: ${GHOSTFOLIO_TOKEN:-}
      READ_ONLY_MODE: "true"
      MCP_TRANSPORT: http
      MCP_HTTP_HOST: 0.0.0.0
      MCP_HTTP_PORT: "8000"
      MCP_HTTP_BEARER_TOKEN: ${GHOSTFOLIO_MCP_BEARER:-}
      LOG_LEVEL: WARNING
    restart: unless-stopped
    # Internal-only by default. Uncomment to expose for direct inspection:
    # ports:
    #   - "8001:8000"

  api:
    build: ./apps/api
    environment:
      INTERNAL_BEARER: ${INTERNAL_BEARER}
      OPEND_HOST: ${OPEND_HOST}
      OPEND_PORT: ${OPEND_PORT}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build: ./apps/web
    # NOTE: bind-mounting ./apps/web for HMR is preferable but Docker Desktop
    # rejects paths not added under Settings → Resources → File Sharing.
    # If you want HMR, add /Users/<you>/Documents/ai-trader to file sharing
    # then re-add the volumes here. Otherwise: `docker compose up -d --build web`.
    environment:
      # Mastra reads these via process.env when routing "<provider>/<model-id>".
      # Set whichever provider you actually use; LLM_MODEL picks the route.
      LLM_MODEL: ${LLM_MODEL}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GOOGLE_GENERATIVE_AI_API_KEY: ${GOOGLE_GENERATIVE_AI_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      # Search providers — primary picked by SEARCH_PROVIDER, the other is the fallback.
      SEARCH_PROVIDER: ${SEARCH_PROVIDER:-brave}
      BRAVE_API_KEY: ${BRAVE_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      # Ghostfolio MCP (in-network HTTP transport, bearer-auth)
      GHOSTFOLIO_MCP_URL: http://ghostfolio-mcp:8000/mcp
      GHOSTFOLIO_MCP_BEARER: ${GHOSTFOLIO_MCP_BEARER:-}
      # Nuxt runtimeConfig — only what /api/login etc. need (everything else
      # reads process.env directly).
      NUXT_APP_PASSWORD: ${APP_PASSWORD}
      NUXT_SESSION_SECRET: ${SESSION_SECRET}
      NUXT_INTERNAL_BEARER: ${INTERNAL_BEARER}
      NUXT_API_BASE_URL: http://api:8000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_started
      drizzle-migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
