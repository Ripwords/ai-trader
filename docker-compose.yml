name: ai-trader

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Cache only: Nitro's `cache` storage (every defineCachedFunction, plus
  # finished risk reports). Nothing here is a source of truth, so there is no
  # volume or persistence; a restart just means the next request refills it.
  # SWR entries carry no TTL, so the memory cap with LRU eviction is what
  # bounds it. The web container falls back to in-memory caching while it is down.
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  drizzle-migrate:
    build:
      context: ./apps/web
      target: migrate
    image: ai-trader-drizzle-migrate:latest
    environment:
      # Derive from parts so it can't drift if you rotate POSTGRES_PASSWORD.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build: ./apps/api
    image: ai-trader-api:latest
    environment:
      INTERNAL_BEARER: ${INTERNAL_BEARER}
      OPEND_HOST: ${OPEND_HOST}
      OPEND_PORT: ${OPEND_PORT}
      # RSA key baked into the image at build (see apps/api/Dockerfile + apps/api/secrets/).
      OPEND_RSA_KEY_PATH: ${OPEND_RSA_KEY_PATH:-/app/secrets/futu_rsa.key}
      # Reporting currency for moomoo account scalars. Unset, the SDK silently
      # converts them into HKD (its accinfo_query default).
      MOOMOO_REPORT_CURRENCY: ${MOOMOO_REPORT_CURRENCY:-MYR}
      # Same DB Drizzle migrates — algo persistence (strategies/runs/signals)
      # is read/written from this side via asyncpg.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      # TradingAgents pipeline — LangChain/LangGraph multi-agent debate.
      # WEB_INTERNAL_BASE_URL is the sibling Nuxt container's /internal/* mount
      # (Yahoo, news search, pricing, and the models chosen in Settings with
      # their keys). Cost cap is a hard $/day ceiling.
      AGENTS_DAILY_COST_USD_CAP: ${AGENTS_DAILY_COST_USD_CAP:-5.00}
      WEB_INTERNAL_BASE_URL: http://web:3000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # External DNS pinned to public resolvers. The Docker default forwards to
    # the host's nameserver, which here is Tailscale's 100.100.100.100 — that
    # address isn't routable from inside Docker Desktop's VM, so when Tailscale
    # hiccups every external lookup fails at once (EAI_AGAIN: GitHub/LiteLLM,
    # ghostfolio MCP). Inter-service names still resolve via Docker's 127.0.0.11.
    dns:
      - 8.8.8.8
      - 1.1.1.1
    depends_on:
      postgres:
        condition: service_healthy
      drizzle-migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    build: ./apps/web
    image: ai-trader-web:latest
    # Container ships the Nitro prod bundle (no bind mount, no HMR).
    # After editing apps/web: `docker compose up -d --build web`.
    environment:
      # Legacy model config, read once to seed Settings when no provider is
      # stored yet. Safe to delete from .env after the first start.
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_MODEL_QUICK: ${LLM_MODEL_QUICK:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GOOGLE_GENERATIVE_AI_API_KEY: ${GOOGLE_GENERATIVE_AI_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      # Search providers — primary picked by SEARCH_PROVIDER, the other is the fallback.
      SEARCH_PROVIDER: ${SEARCH_PROVIDER:-brave}
      BRAVE_API_KEY: ${BRAVE_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      # Reporting currency for the investments layer's blended totals. Must
      # match the api service's value so both layers report the same unit.
      MOOMOO_REPORT_CURRENCY: ${MOOMOO_REPORT_CURRENCY:-MYR}
      # Ghostfolio MCP — point at your remote MCP endpoint.
      # Leave empty to disable (the agent simply won't see ghostfolio_* tools).
      GHOSTFOLIO_MCP_URL: ${GHOSTFOLIO_MCP_URL:-}
      GHOSTFOLIO_MCP_BEARER: ${GHOSTFOLIO_MCP_BEARER:-}
      # Nuxt runtimeConfig — only what /api/login etc. need (everything else
      # reads process.env directly).
      NUXT_APP_PASSWORD: ${APP_PASSWORD}
      NUXT_SESSION_SECRET: ${SESSION_SECRET}
      NUXT_SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-}
      NUXT_INTERNAL_BEARER: ${INTERNAL_BEARER}
      # Encrypts stored LLM provider keys (llm_providers.api_key).
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      NUXT_API_BASE_URL: http://api:8000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      # Notifications (alerts, reminders, finished research). The scheduled
      # tasks run inside this container every minute; see README
      # "Notifications & reminders". Email via Resend: sender is
      # alerts@RESEND_DOMAIN, which must be verified in Resend.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_DOMAIN: ${RESEND_DOMAIN:-}
      # Absolute base for links in emails, e.g. https://trader.example.com.
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-}
      # Web Push keys: `npx web-push generate-vapid-keys`.
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      # 1 stops the price-alert check (reminders and sending keep running).
      PRICE_ALERTS_DISABLED: ${PRICE_ALERTS_DISABLED:-}
      # Nitro cache storage, on the redis service above.
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
    ports:
      - "${WEB_PORT:-3000}:3000"
    # See api service: pin external DNS off the flaky Tailscale resolver so
    # Yahoo (yahoo-finance2) and search providers resolve reliably.
    dns:
      - 8.8.8.8
      - 1.1.1.1
    depends_on:
      api:
        condition: service_started
      redis:
        condition: service_healthy
      drizzle-migrate:
        condition: service_completed_successfully
    # The scheduler lives in this process: if it dies, alerts and reminders
    # stop until it is back, so let Docker bring it back.
    restart: unless-stopped

volumes:
  pgdata:
