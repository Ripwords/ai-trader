[project]
name = "ai-trader-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "moomoo-api>=10.12.7208",
  "httpx>=0.27",
  # Algo strategy sandbox + backtester data prep.
  "numpy>=2.0",
  "pandas>=2.2",
  # Async DB access for algo persistence (strategies/runs/signals).
  "asyncpg>=0.29",
  # TradingAgents pipeline (LangChain + LangGraph + tradingagents).
  "langchain-anthropic>=0.3.15",
  "langchain-core>=0.3.81",
  "langchain-google-genai>=4.0.0",
  "langchain-openai>=0.3.23",
  "langgraph>=0.4.8",
  "langgraph-checkpoint-postgres>=2.0.0",
  # langgraph-checkpoint-postgres pulls psycopg, which needs either
  # the precompiled `binary` extra OR libpq installed system-wide.
  # The api image has neither by default → pin the binary wheel here so
  # `langgraph.checkpoint.postgres` imports cleanly on container boot.
  "psycopg[binary]>=3.2",
  "stockstats>=0.6.5",
  # Mai0313/tradingagents fork (not TauricResearch upstream). Its PyPI listing
  # was removed in Nov 2026, so it is pinned to the v0.5.0 commit tarball in [tool.uv.sources];
  # the tag's pyproject says 0.1.0 because their release job stamps the version.
  "tradingagents",
]

[tool.uv.sources]
tradingagents = { url = "https://github.com/Mai0313/tradingagents/archive/53c933db3f5184ad96f1ab368c7b6690660c7722.tar.gz" }

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
  "ruff>=0.6",
  "testcontainers[postgres]>=4.0",
  "mypy>=1.11",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "smoke: real-LLM smoke tests (gated by RUN_SMOKE=1)",
]

[tool.ruff]
line-length = 100
