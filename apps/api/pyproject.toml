[project]
name = "ai-trader-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "moomoo-api>=10.4.6408",
  "httpx>=0.27",
  # Algo strategy sandbox + backtester data prep.
  "numpy>=2.0",
  "pandas>=2.2",
  # Async DB access for algo persistence (strategies/runs/signals).
  "asyncpg>=0.29",
  # Free fundamentals source (financial metrics, history, insider, news).
  "yfinance>=0.2.40",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
  "ruff>=0.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
